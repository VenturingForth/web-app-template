version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [chore]
    commit-message:
      prefix: chore
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [chore]
    commit-message:
      prefix: chore
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
      # Ungrouped updates get one PR per project. This group puts
      # all major bumps in one PR that covers every project.
      nuget-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [chore]
    commit-message:
      prefix: chore
